<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor — Web de la boda</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      display: grid;
      grid-template-columns: 340px 1fr;
      height: 100vh;
      background: #ece7df;
      color: #2f2a24;
    }
    aside {
      overflow-y: auto;
      padding: 1.2rem;
      background: #fff;
      border-right: 1px solid #ddd3c4;
    }
    aside h1 { font-size: 1.2rem; margin: 0 0 0.3rem; }
    aside p.nota { font-size: 0.8rem; color: #6e6357; margin: 0 0 1rem; }
    fieldset {
      border: 1px solid #e0d6c8;
      border-radius: 10px;
      margin: 0 0 1rem;
      padding: 0.8rem;
    }
    legend { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #a05c3b; }
    label { display: block; font-size: 0.8rem; margin: 0.5rem 0 0.2rem; color: #6e6357; }
    input[type="text"], textarea {
      width: 100%;
      font: inherit;
      font-size: 0.9rem;
      padding: 0.45rem 0.6rem;
      border: 1px solid #d8cdbd;
      border-radius: 7px;
    }
    textarea { resize: vertical; }
    .fila-color { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.5rem; }
    .fila-color label { margin: 0; flex: 1; }
    input[type="color"] { width: 44px; height: 30px; border: 1px solid #d8cdbd; border-radius: 6px; padding: 0; background: none; }
    .acciones { display: grid; gap: 0.5rem; margin-top: 0.5rem; }
    button {
      font: inherit;
      font-size: 0.9rem;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: 1px solid #a05c3b;
      cursor: pointer;
    }
    .primario { background: #a05c3b; color: #fff; }
    .secundario { background: #fff; color: #a05c3b; }
    main { display: grid; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    @media (max-width: 800px) {
      body { grid-template-columns: 1fr; grid-template-rows: 45vh 55vh; }
    }
  </style>
</head>
<body>
  <aside>
    <h1>Editor de la web</h1>
    <p class="nota">Cambia textos y colores; la vista previa se actualiza sola. Para publicar, descarga <b>datos.json</b> y súbelo a GitHub reemplazando el archivo anterior.</p>
    <form id="formulario"></form>
    <div class="acciones">
      <button type="button" class="primario" id="descargar">Descargar datos.json</button>
      <button type="button" class="secundario" id="restaurar">Quitar mis cambios locales</button>
    </div>
  </aside>
  <main>
    <iframe id="vista" src="index.html" title="Vista previa de la web"></iframe>
  </main>
  <script src="editor.js"></script>
</body>
</html>
