<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constructor por bloques — Web de la boda</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      display: grid;
      grid-template-columns: 380px 1fr;
      height: 100vh;
      background: #ece7df;
      color: #2f2a24;
    }
    aside { overflow-y: auto; padding: 1.2rem; background: #fff; border-right: 1px solid #ddd3c4; }
    aside h1 { font-size: 1.2rem; margin: 0 0 0.3rem; }
    aside p.nota { font-size: 0.8rem; color: #6e6357; margin: 0 0 1rem; }
    .paleta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
    .paleta button {
      font: inherit; font-size: 0.78rem; padding: 0.4rem 0.7rem;
      border-radius: 999px; border: 1px solid #a05c3b; background: #fff; color: #a05c3b; cursor: pointer;
    }
    .paleta button:hover { background: #a05c3b; color: #fff; }
    .bloque {
      border: 1px solid #e0d6c8; border-radius: 10px; padding: 0.7rem; margin-bottom: 0.7rem; background: #fbf8f3;
    }
    .bloque .cabecera { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.4rem; }
    .bloque .cabecera strong { font-size: 0.85rem; }
    .bloque .cabecera .ops button {
      font-size: 0.75rem; border: 1px solid #d8cdbd; background: #fff; border-radius: 6px; cursor: pointer; padding: 0.15rem 0.45rem; margin-left: 0.25rem;
    }
    .bloque .ops .borrar { color: #b03a2e; border-color: #e5b8b3; }
    .bloque label { display: block; font-size: 0.75rem; margin: 0.4rem 0 0.15rem; color: #6e6357; }
    .bloque input, .bloque textarea {
      width: 100%; font: inherit; font-size: 0.85rem; padding: 0.4rem 0.55rem;
      border: 1px solid #d8cdbd; border-radius: 7px;
    }
    .bloque textarea { resize: vertical; }
    .acciones { display: grid; gap: 0.5rem; margin-top: 0.8rem; position: sticky; bottom: 0; background: #fff; padding-top: 0.6rem; }
    .acciones button { font: inherit; font-size: 0.9rem; padding: 0.6rem 1rem; border-radius: 8px; border: 1px solid #a05c3b; cursor: pointer; }
    .primario { background: #a05c3b; color: #fff; }
    .secundario { background: #fff; color: #a05c3b; }
    main iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    @media (max-width: 800px) {
      body { grid-template-columns: 1fr; grid-template-rows: 50vh 50vh; }
    }
  </style>
</head>
<body>
  <aside>
    <h1>Constructor por bloques</h1>
    <p class="nota">Añade bloques estándar, rellénalos y ordénalos. La vista previa se actualiza sola. Al terminar, descarga el <b>index.html</b> generado y súbelo a GitHub reemplazando el anterior (junto a <b>styles.css</b>, <b>fondo.svg</b> y la carpeta <b>fotos/</b>).</p>
    <div class="paleta" id="paleta"></div>
    <div id="lista"></div>
    <div class="acciones">
      <button type="button" class="primario" id="descargar">Descargar index.html</button>
      <button type="button" class="secundario" id="reiniciar">Volver a la página actual</button>
    </div>
  </aside>
  <main>
    <iframe id="vista" title="Vista previa"></iframe>
  </main>
  <script src="bloques.js"></script>
</body>
</html>
