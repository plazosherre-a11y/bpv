<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victoria &amp; Pedro | 26.06.2027</title>
  <meta name="description" content="Boda de Victoria y Pedro: 26 de junio de 2027. Ceremonia en la Iglesia Catedral Castrense y celebración en Finca Prados Moros.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .selector {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 1.2rem;
      text-align: center;
      padding: 3rem 1.5rem;
      background-image: url("fondo.svg"), linear-gradient(180deg, #f3e7d6 0%, var(--bg) 75%);
      background-repeat: repeat, no-repeat;
    }
    .selector h1 {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      margin: 0;
    }
    .selector .fecha { letter-spacing: 0.4em; color: var(--ink-soft); margin: 0; }
    .opciones { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(240px, 300px)); justify-content: center; margin-top: 1.5rem; }
    .opcion {
      display: block; text-decoration: none; color: var(--ink);
      background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
      padding: 1.8rem 1.4rem; transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .opcion:hover { transform: translateY(-4px); box-shadow: 0 18px 36px -18px rgba(61, 50, 41, 0.4); }
    .opcion strong { font-family: var(--font-display); font-size: 1.5rem; display: block; margin-bottom: 0.3rem; }
    .opcion span { color: var(--ink-soft); font-size: 0.9rem; }
    .opcion .icono { font-size: 1.8rem; display: block; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <main class="selector">
    <p class="fecha">26 . 06 . 2027</p>
    <h1>Victoria <span class="amp">&amp;</span> Pedro</h1>
    <div class="opciones">
      <a class="opcion" href="web.html">
        <span class="icono" aria-hidden="true">💍</span>
        <strong>Ver la web de la boda</strong>
        <span>Invitados, lugares, fotos y confirmación de asistencia</span>
      </a>
      <a class="opcion" href="panel.html">
        <span class="icono" aria-hidden="true">🛠️</span>
        <strong>Panel de edición</strong>
        <span>Editar la página (requiere contraseña)</span>
      </a>
    </div>
  </main>
</body>
</html>
